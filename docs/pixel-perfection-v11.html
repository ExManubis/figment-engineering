<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Perfection</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #5C2E00;
  display: flex;
  flex-direction: column;
  padding: 2rem 3rem;
  position: relative;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  opacity: 0.06;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

a { color: inherit; text-decoration: none; }

canvas#trail {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

.shape {
  position: fixed;
  z-index: 0;
  pointer-events: none;
}

.shape-1 {
  top: 14%;
  right: 10%;
  width: 70px;
  height: 70px;
  border-radius: 16px;
  background: #AA4E7E;
  opacity: 0;
  animation: shapeIn 1.5s ease forwards 0.8s, float1 16s ease-in-out infinite 2s;
  --op: 0.06;
}

.shape-2 {
  bottom: 20%;
  left: 7%;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #D8A86E;
  opacity: 0;
  animation: shapeIn 1.5s ease forwards 1s, float2 20s ease-in-out infinite 2s;
  --op: 0.07;
}

.shape-3 {
  top: 58%;
  right: 16%;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #EDDA9A;
  opacity: 0;
  animation: shapeIn 1.5s ease forwards 1.2s, float3 13s ease-in-out infinite 2s;
  --op: 0.08;
}

@keyframes shapeIn { from { opacity: 0; } to { opacity: var(--op); } }
@keyframes float1 {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(-10px, 14px) rotate(3deg); }
  50% { transform: translate(6px, -10px) rotate(-2deg); }
  75% { transform: translate(-4px, 6px) rotate(1deg); }
}
@keyframes float2 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(12px, -12px); }
  66% { transform: translate(-8px, 10px); }
}
@keyframes float3 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-14px, -10px); }
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  position: relative;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  animation: slideDown 0.6s ease forwards 0.15s;
}

.logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: #EDDA9A;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 2rem;
  opacity: 0;
  animation: slideDown 0.6s ease forwards 0.25s;
}

.header-right a {
  font-size: 13px;
  color: #EDDA9A;
  opacity: 0.4;
  transition: opacity 0.3s;
}

.header-right a:hover { opacity: 0.9; }

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  position: relative;
}

h1 {
  font-family: 'EB Garamond', 'Garamond', Georgia, serif;
  font-weight: 500;
  font-size: clamp(3rem, 5.5vw, 4.8rem);
  line-height: 1.2;
  letter-spacing: -0.03em;
  color: #EDDA9A;
  max-width: 620px;
  text-align: center;
}

h1 .word {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  animation: wordIn 0.5s ease forwards;
}

h1 .word:nth-child(1) { animation-delay: 0.3s; }
h1 .word:nth-child(2) { animation-delay: 0.38s; }
h1 .word:nth-child(3) { animation-delay: 0.46s; }
h1 .word:nth-child(4) { animation-delay: 0.54s; }
h1 .word:nth-child(5) { animation-delay: 0.62s; }
h1 .word:nth-child(6) { animation-delay: 0.72s; }

h1 .word.accent {
  color: #D8A86E;
  font-style: italic;
}

@keyframes wordIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

footer {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  z-index: 10;
  position: relative;
  opacity: 0;
  animation: fadeIn 0.6s ease forwards 0.9s;
}

.footer-links {
  display: flex;
  gap: 1.75rem;
}

.footer-links a {
  font-size: 13px;
  color: #EDDA9A;
  opacity: 0.3;
  transition: opacity 0.3s;
}

.footer-links a:hover { opacity: 0.8; }

.copyright {
  font-size: 12px;
  color: #EDDA9A;
  opacity: 0.15;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  body { padding: 1.5rem; }
  .header-right { gap: 1.25rem; }
  canvas#trail { display: none; }
}
</style>
</head>
<body>

<canvas id="trail"></canvas>

<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>

<header>
  <div class="logo">
    <svg width="18" height="21" viewBox="0 0 120 140">
      <rect x="12" y="8" width="40" height="108" rx="11" fill="#EDDA9A" opacity="0.8"/>
      <rect x="34" y="8" width="48" height="48" rx="12" fill="#AA4E7E" opacity="0.6"/>
      <circle cx="76" cy="78" r="15" fill="#D8A86E" opacity="0.65"/>
      <circle cx="92" cy="104" r="8" fill="#EDDA9A" opacity="0.5"/>
    </svg>
    <span class="logo-text">Pixel Perfection</span>
  </div>
  <div class="header-right">
    <a href="#">Work</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</header>

<main>
  <h1>
    <span class="word">Great</span>
    <span class="word">design</span>
    <span class="word">should</span>
    <span class="word">be</span>
    <span class="word">for</span>
    <span class="word accent">everyone.</span>
  </h1>
</main>

<footer>
  <div class="footer-links">
    <a href="#">Instagram</a>
    <a href="#">LinkedIn</a>
    <a href="mailto:hello@pixelperfection.dk">hello@pixelperfection.dk</a>
  </div>
  <span class="copyright">&copy; 2026 Pixel Perfection</span>
</footer>

<script>
const canvas = document.getElementById('trail');
const ctx = canvas.getContext('2d');
let w, h, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Pixel trail — static 12x12 purple squares that fade in place
const pixels = [];
let mouseX = -100, mouseY = -100;
let prevX = -100, prevY = -100;
let hasMoved = false;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (!hasMoved) {
    prevX = mouseX;
    prevY = mouseY;
    hasMoved = true;
  }
});

function spawnPixels() {
  const dx = mouseX - prevX;
  const dy = mouseY - prevY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < 8) return;

  // Place a pixel every ~12px along the path
  const steps = Math.max(1, Math.floor(dist / 12));
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const x = prevX + dx * t;
    const y = prevY + dy * t;

    // Snap to a 12px grid for that crisp pixel feel
    const sx = Math.round(x / 12) * 12;
    const sy = Math.round(y / 12) * 12;

    pixels.push({
      x: sx,
      y: sy,
      born: performance.now(),
      opacity: 0.55
    });
  }

  prevX = mouseX;
  prevY = mouseY;
}

// Fade duration in ms — tuned to match Browser Company feel
const FADE_DURATION = 800;

function animate(now) {
  ctx.clearRect(0, 0, w, h);

  spawnPixels();

  ctx.fillStyle = '#AA4E7E';

  for (let i = pixels.length - 1; i >= 0; i--) {
    const p = pixels[i];
    const age = now - p.born;

    if (age > FADE_DURATION) {
      pixels.splice(i, 1);
      continue;
    }

    // Ease out fade
    const progress = age / FADE_DURATION;
    const ease = 1 - progress * progress;
    ctx.globalAlpha = p.opacity * ease;
    ctx.fillRect(p.x - 6, p.y - 6, 12, 12);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
